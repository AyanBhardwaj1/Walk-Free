name: Probe data sources

# Checks that the free data and model endpoints Walk-Free uses (or might)
# answer, and prints each response's shape. Run by hand from the Actions tab.
on:
  workflow_dispatch:
  # Also when this file changes, so a branch can run it before main has it.
  push:
    paths:
      - .github/workflows/probe-data-sources.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe endpoints
        shell: bash
        run: |
          UA="Walk-Free (github.com/AyanBhardwaj1/Walk-Free)"
          probe() {
            echo "=== $1"
            code=$(curl -sS -A "$UA" -o body.txt -w "%{http_code}" --max-time 30 "$2" || echo "curl-failed")
            echo "status: $code  bytes: $(wc -c < body.txt 2>/dev/null || echo 0)"
            head -c 1500 body.txt | tr '\n' ' '
            echo
          }
          probe "NWS active alerts (Phoenix)" "https://api.weather.gov/alerts/active?point=33.4255,-111.94"
          probe "NWS active alerts (Austin)" "https://api.weather.gov/alerts/active?point=30.285,-97.734"
          probe "Open-Meteo air quality" "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=30.285&longitude=-97.734&current=us_aqi,pm2_5,ozone&hourly=us_aqi,pm2_5&forecast_hours=6&timezone=GMT"
          probe "Open-Meteo radiation parts" "https://api.open-meteo.com/v1/forecast?latitude=30.285&longitude=-97.734&current=shortwave_radiation,direct_radiation,diffuse_radiation,direct_normal_irradiance&hourly=direct_radiation_instant,diffuse_radiation_instant,direct_normal_irradiance_instant&forecast_hours=3&timezone=GMT"
          probe "Open-Meteo elevation" "https://api.open-meteo.com/v1/elevation?latitude=30.285,30.29&longitude=-97.734,-97.73"
          probe "NWS HeatRisk ImageServer" "https://mapservices.weather.noaa.gov/experimental/rest/services/NWS_HeatRisk/ImageServer?f=json"
          probe "NWS HeatRisk identify (Phoenix)" "https://mapservices.weather.noaa.gov/experimental/rest/services/NWS_HeatRisk/ImageServer/identify?geometry=%7B%22x%22%3A-111.94%2C%22y%22%3A33.4255%2C%22spatialReference%22%3A%7B%22wkid%22%3A4326%7D%7D&geometryType=esriGeometryPoint&returnGeometry=false&f=json"
          probe "Meta Model API (no key; expect 401)" "https://api.meta.ai/v1/models"
          probe "Old Llama API (no key)" "https://api.llama.com/compat/v1/models"
      - name: Check the production site
        shell: bash
        run: |
          SITE=https://walk-free.vercel.app
          check() {
            code=$(curl -sS -o body.txt -w "%{http_code}" --max-time 30 "$SITE$2" || echo "curl-failed")
            echo "=== $1: HTTP $code (expect $3)"
            head -c 300 body.txt | tr '\n' ' '; echo
          }
          check "Health" "/api/health" 200
          check "Guest demo page" "/demo" 200
          check "Outlook without a session (guests use the providers directly)" "/api/outlook?lat=30.29&lon=-97.73" 401
          # The deployed app should contain tonight's features. The workspace
          # is split into lazily loaded chunks, so follow chunk references.
          python3 - <<'PY'
          import re, urllib.request
          site = "https://walk-free.vercel.app"
          get = lambda path: urllib.request.urlopen(site + path, timeout=30).read().decode("utf-8", "replace")
          queue = sorted(set(re.findall(r"/?assets/[\w.-]+\.js", get("/demo"))))
          seen, text = set(), ""
          while queue and len(seen) < 120:
              name = "/assets/" + queue.pop().split("assets/")[-1].lstrip("./")
              if name in seen:
                  continue
              seen.add(name)
              try:
                  body = get(name)
              except Exception as error:
                  print("could not fetch", name, error)
                  continue
              text += body
              queue += [m for m in re.findall(r"[\w-]+-[\w-]{8}\.js", body)]
          print("chunks fetched:", len(seen))
          for word in ["SUN AVERSION", "outlook-notice", "air-quality-api.open-meteo.com", "muse-spark-1.3"]:
              print(("bundle has: " if word in text else "bundle MISSING: ") + word)
          PY
