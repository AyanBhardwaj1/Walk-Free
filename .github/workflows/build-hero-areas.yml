name: Build hero areas

# Regenerates the pre-built UT Austin and UC Berkeley map data from
# OpenStreetMap and commits it to the branch the workflow ran on.
on:
  workflow_dispatch:
    inputs:
      areas:
        description: "Space-separated area slugs to build (blank builds all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build areas
        # Passed through env, never interpolated into the script itself.
        env:
          AREAS: ${{ inputs.areas }}
        run: npm run areas:build -- $AREAS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-areas
          path: public/areas/*.json
          if-no-files-found: warn
      - name: Commit updated areas
        # Keep whichever areas succeeded even if another one failed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/areas
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh pre-built hero areas"
          # The branch may have moved while the build ran.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
